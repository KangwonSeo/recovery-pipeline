#
# Recovery kernel framebuffer support for existing QEMU display
#

#
# Initramfs support
#
CONFIG_BLK_DEV_INITRD=y
CONFIG_INITRAMFS_SOURCE=""
CONFIG_RD_LZ4=y
CONFIG_DECOMPRESS_LZ4=y
CONFIG_KERNEL_LZ4=y

#
# dev/proc/sysfs
#
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

#
# PCI support - required for QEMU VGA/Bochs display device
#
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_HAS_IOMEM=y

#
# DMA buffer support
#
CONFIG_DMA_SHARED_BUFFER=y

#
# Firmware/sysfb fallback
#
CONFIG_SYSFB=y
CONFIG_SYSFB_SIMPLEFB=y

#
# Framebuffer core
#
CONFIG_FB=y
CONFIG_FB_CORE=y
CONFIG_FB_DEVICE=y
CONFIG_FB_DEFERRED_IO=y

#
# Legacy QEMU VGA framebuffer drivers
#
CONFIG_FB_VESA=y
CONFIG_FB_EFI=y
CONFIG_FB_SIMPLE=y

#
# DRM core and fbdev emulation
#
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100

#
# QEMU standard VGA / Bochs DRM driver
# This is the important one for QEMU default/std VGA.
#
CONFIG_DRM_BOCHS=y

#
# SimpleDRM fallback
#
CONFIG_DRM_SIMPLEDRM=y

#
# Console support
#
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_HW_CONSOLE=y
CONFIG_DUMMY_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y

#
# Existing reductions
#
# CONFIG_FW_LOADER is not set
# CONFIG_NVMEM is not set
# CONFIG_CONNECTOR is not set
# CONFIG_PROC_EVENTS is not set
# CONFIG_TASKSTATS is not set

# CONFIG_BLK_DEV_FD is not set
# CONFIG_PARPORT is not set
# CONFIG_PARPORT_PC is not set
# CONFIG_PRINTER is not set

# CONFIG_UNIX98_PTYS is not set
# CONFIG_LEGACY_PTYS is not set

# CONFIG_CRYPTO is not set
# CONFIG_CRYPTO_JITTERENTROPY is not set
# CONFIG_CRYPTO_DRBG is not set
# CONFIG_CRYPTO_USER_API is not set
# CONFIG_AF_ALG is not set

# CONFIG_BLK_DEV_NBD is not set
# CONFIG_SCSI_DEBUG is not set
# CONFIG_BLK_DEV_LOOP is not set
